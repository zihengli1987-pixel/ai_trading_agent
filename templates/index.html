// ===== WebSocket 实时连接 =====
const socket = io();

socket.on('connect', function() {
    console.log('✅ 已连接到服务器');
    // 订阅特斯拉实时数据
    socket.emit('subscribe', { symbol: 'TSLA' });
});

socket.on('stock_update', function(data) {
    console.log('📊 实时数据更新:', data.symbol, '评分:', data.score);
    
    // 更新对应股票的卡片
    updateStockCard(data);
});

function updateStockCard(data) {
    // 找到对应的卡片并更新评分、价格、信号
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
        const symbolEl = card.querySelector('.symbol');
        if (symbolEl && symbolEl.textContent === data.symbol) {
            // 更新价格
            const priceEl = card.querySelector('.price');
            if (priceEl) priceEl.textContent = '$' + data.price;
            
            // 更新涨跌幅
            const changeEl = card.querySelector('.change');
            if (changeEl) {
                changeEl.textContent = (data.change >= 0 ? '+' : '') + data.change + '%';
                changeEl.className = 'change ' + (data.change >= 0 ? 'up' : 'down');
            }
            
            // 更新评分
            const badgeEl = card.querySelector('.score-badge');
            if (badgeEl) {
                badgeEl.textContent = data.score;
                badgeEl.className = 'score-badge ' + (data.score >= 80 ? 'high' : data.score >= 65 ? 'medium' : 'low');
            }
            
            // 更新信号
            const signalEl = card.querySelector('.signal');
            if (signalEl) {
                signalEl.textContent = data.action;
                signalEl.className = 'signal ' + data.signal_type.toLowerCase();
            }
            
            // 更新交易计划
            updateTradePlan(card, data);
        }
    });
}
